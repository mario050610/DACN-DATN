services:
  - type: web
    name: preora-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    autoDeployTrigger: off
    envVars:
      - key: AUTH_DATABASE_PATH
        value: /var/data/accounts.sqlite3
      - key: TRAINING_JOBS_DIR
        value: /var/data/ai-training
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
