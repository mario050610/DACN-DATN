<title id="title">Kiến trúc prototype PREORA hiện tại</title><desc id="desc">Frontend gọi backend. Backend dùng các SQLite và khởi chạy worker ML. HTTP AI service trả 503, chatbot dùng Ollama riêng. PostgreSQL là thiết kế mục tiêu.</desc>
